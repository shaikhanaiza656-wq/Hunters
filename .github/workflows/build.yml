name: Build Debug APK

# Real CI build — no shortcuts. This will only succeed once you've added the
# repo secrets listed below; without them the build correctly fails, same as
# a local build without google-services.json (see README).
on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # This repo's gradle-wrapper.jar is intentionally not committed (it's a
      # compiled binary distributed by Gradle itself). setup-gradle provides a
      # real `gradle` binary so the very first step can generate the real jar.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate gradle-wrapper.jar
        run: gradle wrapper --gradle-version 8.7

      # Required secret: GOOGLE_SERVICES_JSON — base64 of your real
      # app/google-services.json (from Firebase Console → Project settings →
      # your Android app). Generate the base64 locally with:
      #   base64 -i google-services.json | tr -d '\n'
      # then paste the output as a repo secret (Settings → Secrets and
      # variables → Actions → New repository secret).
      - name: Write google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is not set — see workflow comments for how to generate it."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlobalMMORPG-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
